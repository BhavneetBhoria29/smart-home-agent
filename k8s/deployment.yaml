apiVersion: v1
kind: Namespace
metadata:
  name: smart-home
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smart-home-agent
  namespace: smart-home
  annotations:
    iam.gke.io/gcp-service-account: ${GSA_EMAIL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-home-agent
  namespace: smart-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-home-agent
  template:
    metadata:
      labels:
        app: smart-home-agent
    spec:
      serviceAccountName: smart-home-agent
      containers:
        - name: agent
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            # Gemini via Vertex AI + Workload Identity: no API key in the cluster
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: ${PROJECT_ID}
            - name: GOOGLE_CLOUD_LOCATION
              value: global
            - name: ALLOW_ORIGINS
              value: http://34.179.235.210.nip.io
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: smart-home-agent
  namespace: smart-home
spec:
  type: LoadBalancer
  selector:
    app: smart-home-agent
  ports:
    - port: 80
      targetPort: 8080
